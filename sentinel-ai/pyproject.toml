[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sentinel-ai"
version = "1.0.0"
description = "A society of AI agents that investigates threats the way a senior SOC analyst would — in 8 seconds instead of 45 minutes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SENTINEL-AI Team"}
]
dependencies = [
    "camel-ai[all]>=0.2.0",
    "cerebras-cloud-sdk>=1.0.0",
    "chromadb>=0.5.0",
    "duckdb>=1.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "plotly>=5.20.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["sentinel*", "dashboard*"]
